name: gamestats-entrega-v1-1
services:
  go-ingestion:
    image: ghcr.io/sebastianvd32/gamestats-go:v1.1.0
    platform: linux/amd64
    pull_policy: always
    environment:
      HTTP_ADDR: ':8080'
      WORKER_COUNT: '4'
      ANALYZER_URL: http://scala-analysis:8081/api/v1/matches
    ports:
      - '127.0.0.1:${GAMESTATS_GO_PORT:-8080}:8080'
    depends_on:
      scala-analysis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/app/healthcheck']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
  scala-analysis:
    image: ghcr.io/sebastianvd32/gamestats-scala:v1.1.0
    platform: linux/amd64
    pull_policy: always
    ports:
      - '127.0.0.1:${GAMESTATS_SCALA_PORT:-8081}:8081'
    volumes:
      - results:/data/results
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8081/healthz']
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    restart: unless-stopped
  panel:
    image: ghcr.io/sebastianvd32/gamestats-panel:v1.1.0
    platform: linux/amd64
    pull_policy: always
    environment:
      GO_URL: http://go-ingestion:8080
      SCALA_URL: http://scala-analysis:8081
    ports:
      - '127.0.0.1:${GAMESTATS_PANEL_PORT:-8090}:8090'
    volumes:
      - panel-history:/data/panel
    depends_on:
      go-ingestion:
        condition: service_healthy
      scala-analysis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  demo:
    image: ghcr.io/sebastianvd32/gamestats-demo:v1.1.0
    platform: linux/amd64
    pull_policy: always
    profiles: ['demo']
    environment:
      GO_URL: http://go-ingestion:8080
      SCALA_URL: http://scala-analysis:8081
    depends_on:
      go-ingestion:
        condition: service_healthy
      scala-analysis:
        condition: service_healthy
    restart: 'no'
volumes:
  results:
  panel-history:
