name: GameStats CI/CD

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamestats-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Formato, pruebas y compilación de Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-ingestion

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-ingestion/go.mod
          cache-dependency-path: go-ingestion/go.mod

      - name: Verificar formato
        run: test -z "$(gofmt -l .)"

      - name: Ejecutar análisis estático
        run: go vet ./...

      - name: Ejecutar pruebas con detector de carreras
        run: go test -race -coverprofile=coverage.out ./...

      - name: Compilar servicio
        run: go build -trimpath -o bin/gamestats ./cmd/gamestats

      - name: Validar datos intercalados de demostración
        run: |
          ./bin/gamestats \
            -input ./testdata/valid/interleaved-events.jsonl \
            -serve=false \
            -output "${RUNNER_TEMP}/ready-matches.jsonl"
          test "$(wc -l < "${RUNNER_TEMP}/ready-matches.jsonl")" -eq 12

      - name: Validar rechazo de datos inválidos
        run: |
          for fixture in ./testdata/invalid/*; do
            if ./bin/gamestats \
              -input "${fixture}" \
              -serve=false \
              -output "${RUNNER_TEMP}/invalid-output.jsonl"; then
              echo "Se aceptó un archivo que debía rechazarse: ${fixture}"
              exit 1
            fi
          done

      - name: Publicar binario y cobertura
        uses: actions/upload-artifact@v7
        with:
          name: go-ingestion-${{ github.sha }}
          path: |
            go-ingestion/bin/gamestats
            go-ingestion/coverage.out
          if-no-files-found: error

  go-container:
    name: Construir contenedor de Go
    runs-on: ubuntu-latest
    needs: go-quality

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen sin publicarla
        uses: docker/build-push-action@v7
        with:
          context: ./go-ingestion
          push: false
          tags: gamestats/go-ingestion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
