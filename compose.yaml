services:
  go-ingestion:
    build:
      context: ./go-ingestion
    image: gamestats/go-ingestion:local
    environment:
      HTTP_ADDR: ":8080"
      WORKER_COUNT: "4"
      OUTPUT_PATH: /data/ready-matches.jsonl
      ANALYZER_URL: http://scala-analysis:8081/api/v1/matches
    ports:
      - "127.0.0.1:${GAMESTATS_GO_PORT:-8080}:8080"
    volumes:
      - gamestats-data:/data
    depends_on:
      scala-analysis:
        condition: service_healthy
    restart: unless-stopped

  scala-analysis:
    build: ./scala-analytics
    image: gamestats/scala-analysis:local
    ports:
      - "127.0.0.1:${GAMESTATS_SCALA_PORT:-8081}:8081"
    volumes:
      - scala-results:/data/results
    restart: unless-stopped

  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    image: gamestats/panel:local
    environment:
      GO_URL: http://go-ingestion:8080
      SCALA_URL: http://scala-analysis:8081
    ports:
      - "127.0.0.1:${GAMESTATS_PANEL_PORT:-8090}:8090"
    volumes:
      - panel-history:/data/panel
    depends_on:
      go-ingestion:
        condition: service_healthy
      scala-analysis:
        condition: service_healthy
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: distribution/demo/Dockerfile
    image: gamestats/demo:local
    profiles: [demo]
    environment:
      GO_URL: http://go-ingestion:8080
      SCALA_URL: http://scala-analysis:8081
    depends_on:
      go-ingestion:
        condition: service_healthy
      scala-analysis:
        condition: service_healthy

volumes:
  scala-results:
  gamestats-data:
  panel-history:
